# AeroSpace Configuration
# Optimized for developer workflow

config-version = 2

# Override AeroSpace's smart startup layout for the project workspace
after-startup-command = ['layout --workspace Q --root h_tiles']

# Start AeroSpace at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion padding
accordion-padding = 30

# Layout defaults
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Unhide hidden apps
automatically-unhide-macos-hidden-apps = false

# SketchyBar integration - notify on workspace change
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# SketchyBar integration - refresh the mode indicator; the plugin reads the current mode
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_change']

# SketchyBar integration - window moves and closes change focus without a workspace change
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_workspace_change']

# Persistent workspaces
# 1: Terminal (Ghostty)
# 2-3: general use
# C: Web Browser (Comet, Chrome)
# G: Game/Chill
# S: Social (Discord, Slack, Telegram)
# Q: Linear + Slack (Project management)
# D: Docker
# A: AI/Agents
# Z: Obsidian (Notes)
# X: Xcode
# P: Planner (SessionFlow)
persistent-workspaces = ["1", "2", "3", "C", "G", "S", "Q", "D", "A", "Z", "X", "P"]

# Workspace-to-monitor assignment
# Built-in (main): all letter workspaces
# Extended (secondary): 1-3 when available, fallback to main
[workspace-to-monitor-force-assignment]
1 = ['secondary', 'main']
2 = ['secondary', 'main']
3 = ['secondary', 'main']
C = 'main'
G = 'main'
S = 'main'
Q = 'main'
D = 'main'
A = 'main'
Z = 'main'
X = 'main'
P = 'main'

[key-mapping]
    preset = 'qwerty'

# Gaps for better visual separation
# Per-monitor top gap: built-in (notch) = 10, external = 50 for SketchyBar
[gaps]
    inner.horizontal = 12
    inner.vertical = 12
    outer.left = 10
    outer.bottom = 10
    outer.top = [
        { monitor."built-in" = 10 },
        50
    ]
    outer.right = 10

# Window rules - Auto floating for system apps
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'layout tiling'

# Auto move apps to designated workspaces
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'ai.perplexity.comet'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.app-id = 'com.tdesktop.Telegram'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.linear'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-id = 'com.google.android.studio'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-id = 'com.kibermaks.SessionFlow'
run = 'move-node-to-workspace P'

# Main binding mode
[mode.main.binding]

    # Open Ghostty with Alt + Enter (like i3)
    alt-enter = 'exec-and-forget open -a "Ghostty"'

    # Layout switching
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Fullscreen toggle
    alt-f = 'fullscreen'

    # Maximize floating window on the screen that holds it, using the same gaps as tiling
    # (outer 10, top 10 on built-in and 50 on external for SketchyBar)
    alt-m = '''exec-and-forget osascript -l JavaScript -e '
        ObjC.import("AppKit");
        ObjC.import("CoreGraphics");
        const outer = 10;
        const win = Application("System Events").processes.whose({frontmost: true})[0].windows[0];
        const [wx, wy] = win.position();
        const [ww, wh] = win.size();
        const cx = wx + ww / 2;
        const cy = wy + wh / 2;
        const screens = $.NSScreen.screens;
        const primaryHeight = screens.objectAtIndex(0).frame.size.height;
        for (let i = 0; i < screens.count; i++) {
            const screen = screens.objectAtIndex(i);
            const f = screen.frame;
            const top = primaryHeight - f.origin.y - f.size.height;
            if (cx < f.origin.x || cx >= f.origin.x + f.size.width || cy < top || cy >= top + f.size.height) continue;
            const v = screen.visibleFrame;
            const vTop = primaryHeight - v.origin.y - v.size.height;
            const id = screen.deviceDescription.objectForKey("NSScreenNumber").js;
            const topGap = $.CGDisplayIsBuiltin(id) ? 10 : 50;
            win.position = [v.origin.x + outer, vTop + topGap];
            win.size = [v.size.width - outer * 2, v.size.height - topGap - outer];
            break;
        }'
    '''

    # Focus (Vim-style)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move windows
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Number workspaces (1-3)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'

    # Letter workspaces (meaningful names)
    alt-c = 'workspace C'  # Chrome/Comet (Web Browser)
    alt-g = 'workspace G'  # Game/Chill
    alt-s = 'workspace S'  # Social
    alt-q = 'workspace Q'  # Linear + Slack (Project)
    alt-d = 'workspace D'  # Docker
    alt-a = 'workspace A'  # AI/Agents
    alt-z = 'workspace Z'  # Obsidian (Notes)
    alt-x = 'workspace X'  # Xcode
    alt-p = 'workspace P'  # Planner (SessionFlow)

    # Move to number workspaces
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'

    # Move to letter workspaces
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-g = 'move-node-to-workspace G'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-z = 'move-node-to-workspace Z'
    alt-shift-x = 'move-node-to-workspace X'
    alt-shift-p = 'move-node-to-workspace P'

    # Workspace navigation
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Enter service mode
    alt-shift-semicolon = 'mode service'

# Service mode for advanced operations
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']  # Reset layout
    f = ['layout floating tiling', 'mode main']  # Toggle floating/tiling
    backspace = ['close-all-windows-but-current', 'mode main']

    # Summon all windows to current workspace (rescue lost windows) + re-tile + reload sketchybar
    # Excludes Social apps (Discord, Slack, Telegram)
    s = ['exec-and-forget aerospace list-windows --all --format "%{app-name}|%{window-id}" | grep -v -E "^(Discord|Slack|Telegram)\\|" | cut -d"|" -f2 | xargs -I{} aerospace move-node-to-workspace --window-id {} $(aerospace list-workspaces --focused) && aerospace flatten-workspace-tree && sketchybar --reload', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
