# tmux 配置
# 位置: dotfiles-macos/.tmux.conf → symlink 到 ~/.tmux.conf
# 對齊 ~/.wezterm.lua 的 leader + keybindings

# ============================================
# 一般設定
# ============================================

# 避免 macOS path_helper 重排 PATH (zsh 環境一致)
set -g default-command "${SHELL}"

# True color (對齊 WezTerm)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 滑鼠：選字、滾輪 scrollback、拖 pane border
set -g mouse on

# 對齊 WezTerm scrollback_lines = 10000
set -g history-limit 10000

# Esc 不延遲 (vim 重要)
set -sg escape-time 0

# Window/Pane 從 1 起算
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy mode 使用 vi 風格 (對齊 Zed vim_mode)
setw -g mode-keys vi

# Focus pane 變深 (Catppuccin crust) 突出焦點,非 active pane 維持 base
# 注意：bg=default 在 tmux 是「沿用 window-style」,要顯示終端原色得明確指定 hex
set -g window-style "bg=#1e1e2e"
set -g window-active-style "bg=#11111b"

# ============================================
# Prefix (對應 WezTerm leader = Ctrl-a)
# ============================================

unbind C-b
set -g prefix C-a
# 連按兩次 Ctrl-a 送出真正的 Ctrl-a (對應 WezTerm leader|CTRL+a)
bind C-a send-prefix

# ============================================
# Pane 分割 (對齊 WezTerm: | 左右、- 上下,繼承 cwd)
# ============================================

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ============================================
# Pane 導航 (vim hjkl + ; 切回上個 pane)
# ============================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind \; last-pane

# ============================================
# Pane 大小調整 (一次 5 格,可重複按)
# ============================================

bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# ============================================
# Pane 操作
# ============================================

# z: 預設 toggle zoom (對齊 WezTerm,保留)
# 覆寫 x: 不確認 (WezTerm 是 no-confirm)
unbind x
bind x kill-pane
# 對齊 WezTerm leader+Space 旋轉 panes
bind Space rotate-window

# ============================================
# Window (= WezTerm tab)
# ============================================

# n/p: 預設 next/previous-window
# ,: 預設 rename-window prompt
# 1..9: 預設 select-window -t
# 覆寫 c 讓新 window 繼承當前 cwd
unbind c
bind c new-window -c "#{pane_current_path}"
# 覆寫 & 不確認
unbind &
bind & kill-window

# ============================================
# Copy / Paste (vi 風格)
# ============================================

# [: 預設 copy-mode
# ]: 預設 paste-buffer
bind -T copy-mode-vi v send -X begin-selection
# pipe-and-cancel 只送 pbcopy,不寫進 tmux 內部 buffer,避免 attach 時被自動貼進前景 TUI
bind -T copy-mode-vi y send -X pipe-and-cancel "pbcopy"
# 滑鼠拖選結束也走同一路徑
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X pipe-and-cancel "pbcopy"

# ============================================
# Session (= WezTerm workspace)
# ============================================

# s: 預設 choose-tree -Zs (對齊 WezTerm fuzzy workspace launcher)
# $: 預設 rename-session prompt (對齊 WezTerm)
# :: 預設 command-prompt (對齊 WezTerm command palette)

# ============================================
# Reload
# ============================================

bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"
